<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="arq-title arq-desc">
  <title id="arq-title">Como a API funciona por dentro</title>
  <desc id="arq-desc">Agendamento: POST /appointments chega no AppointmentController, que chama o AppointmentService (Facade). A Facade busca o cliente, calcula o preço com o PriceCalculator (Strategy), calcula a taxa de leva e traz e salva o agendamento. Cadastro: POST /customers passa pelo CustomerController, CustomerService e AddressLookupService, que consulta o ViaCEP pelo ViaCepClient. Todos os componentes são beans Singleton do Spring.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#690037"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="718" rx="18" fill="#FFFFFF" stroke="#FAB9FF" stroke-width="2"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="58" font-size="26" font-weight="700" fill="#690037">Agendamento</text>

    <rect x="30" y="225" width="190" height="60" rx="12" fill="#FA5A50"/>
    <text x="125" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">POST /appointments</text>
    <line x1="220" y1="255" x2="262" y2="255" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="265" y="225" width="235" height="60" rx="12" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <text x="382" y="262" text-anchor="middle" font-size="18" fill="#690037">AppointmentController</text>
    <line x1="500" y1="255" x2="542" y2="255" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="545" y="165" width="250" height="180" rx="16" fill="#690037"/>
    <rect x="610" y="185" width="120" height="30" rx="15" fill="#FAB9FF"/>
    <text x="670" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#690037" letter-spacing="1">FACADE</text>
    <text x="670" y="258" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">AppointmentService</text>
    <text x="670" y="290" text-anchor="middle" font-size="15" fill="#FFFFFF">um método, schedule(),</text>
    <text x="670" y="312" text-anchor="middle" font-size="15" fill="#FFFFFF">coordena tudo em ordem</text>

    <line x1="795" y1="205" x2="867" y2="126" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>
    <line x1="795" y1="240" x2="867" y2="216" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>
    <line x1="795" y1="275" x2="867" y2="306" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>
    <line x1="795" y1="310" x2="867" y2="396" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <g font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="826" cy="171" r="13" fill="#FA5A50"/><text x="826" y="176">1</text>
      <circle cx="826" cy="230" r="13" fill="#FA5A50"/><text x="826" y="235">2</text>
      <circle cx="826" cy="288" r="13" fill="#FA5A50"/><text x="826" y="293">3</text>
      <circle cx="826" cy="347" r="13" fill="#FA5A50"/><text x="826" y="352">4</text>
    </g>

    <rect x="870" y="90" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#FA5A50" stroke-width="2"/>
    <text x="890" y="121" font-size="18" font-weight="700" fill="#690037">CustomerRepository</text>
    <text x="890" y="146" font-size="15" fill="#6B4A5A">busca o cliente</text>

    <rect x="870" y="180" width="300" height="72" rx="12" fill="#FAB9FF"/>
    <text x="890" y="211" font-size="18" font-weight="700" fill="#690037">PriceCalculator</text>
    <rect x="1060" y="194" width="98" height="24" rx="12" fill="#690037"/>
    <text x="1109" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">STRATEGY</text>
    <text x="890" y="236" font-size="15" fill="#690037">Bath · Grooming · Walk</text>

    <rect x="870" y="270" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#FA5A50" stroke-width="2"/>
    <text x="890" y="301" font-size="18" font-weight="700" fill="#690037">PickupFeeCalculator</text>
    <text x="890" y="326" font-size="15" fill="#6B4A5A">taxa de leva e traz pela cidade</text>

    <rect x="870" y="360" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#FA5A50" stroke-width="2"/>
    <text x="890" y="391" font-size="18" font-weight="700" fill="#690037">AppointmentRepository</text>
    <text x="890" y="416" font-size="15" fill="#6B4A5A">salva o agendamento no H2</text>

    <line x1="40" y1="470" x2="1160" y2="470" stroke="#FAB9FF" stroke-width="2" stroke-dasharray="8 8"/>

    <text x="40" y="518" font-size="26" font-weight="700" fill="#690037">Cadastro de cliente</text>

    <rect x="30" y="550" width="190" height="60" rx="12" fill="#FA5A50"/>
    <text x="125" y="587" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">POST /customers</text>
    <line x1="220" y1="580" x2="262" y2="580" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="265" y="550" width="210" height="60" rx="12" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <text x="370" y="587" text-anchor="middle" font-size="18" fill="#690037">CustomerController</text>
    <line x1="475" y1="580" x2="517" y2="580" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="520" y="550" width="185" height="60" rx="12" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <text x="612" y="587" text-anchor="middle" font-size="18" fill="#690037">CustomerService</text>
    <line x1="705" y1="580" x2="747" y2="580" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="750" y="550" width="215" height="60" rx="12" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <text x="857" y="587" text-anchor="middle" font-size="18" fill="#690037">AddressLookupService</text>
    <line x1="965" y1="580" x2="1047" y2="580" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>
    <text x="1006" y="568" text-anchor="middle" font-size="13" fill="#6B4A5A">ViaCepClient</text>

    <rect x="1050" y="550" width="120" height="60" rx="30" fill="#FFFFFF" stroke="#FA5A50" stroke-width="2.5"/>
    <text x="1110" y="587" text-anchor="middle" font-size="18" font-weight="700" fill="#FA5A50">ViaCEP</text>

    <path d="M1 646 H1199 V701 A18 18 0 0 1 1181 719 H19 A18 18 0 0 1 1 701 Z" fill="#FAB9FF"/>
    <rect x="30" y="666" width="120" height="32" rx="16" fill="#690037"/>
    <text x="90" y="688" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="1">SINGLETON</text>
    <text x="170" y="688" font-size="17" fill="#690037">Cada componente é um bean do Spring: uma única instância, compartilhada por toda a aplicação.</text>
  </g>
</svg>
